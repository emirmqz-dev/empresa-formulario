
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Captura de Datos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --warning: #f59e0b;
      --warning-hover: #d97706;
      --secondary: #0284c7;
      --secondary-hover: #0369a1;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 10px;
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      line-height: 1.5;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 1.5rem;
      letter-spacing: -0.025em;
    }

    /* Form Grid Layout */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    input[type="text"],
    input[type="number"],
    input[type="email"],
    input[type="tel"] {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    /* Action Buttons */
    .actions-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    button {
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.65rem 1.25rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    #btnRegistrar { background: var(--primary); color: white; }
    #btnRegistrar:hover:not(:disabled) { background: var(--primary-hover); }

    #btnConsultar { background: var(--secondary); color: white; }
    #btnConsultar:hover:not(:disabled) { background: var(--secondary-hover); }

    #btnModificar { background: var(--warning); color: white; }
    #btnModificar:hover:not(:disabled) { background: var(--warning-hover); }

    #btnEliminar { background: var(--danger); color: white; }
    #btnEliminar:hover:not(:disabled) { background: var(--danger-hover); }

    #btnCerrar {
      background: #e2e8f0;
      color: var(--text);
    }
    #btnCerrar:hover { background: #cbd5e1; }

    /* Estado Notificación */
    #estado {
      font-weight: 500;
      color: var(--primary);
      margin-top: 1rem;
      font-size: 0.9rem;
      min-height: 1.25rem;
    }

    /* Tabla y Buscador */
    #seccionTabla {
      display: none;
    }

    .table-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    #buscador {
      max-width: 320px;
    }

    .table-container {
      overflow-x: auto;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      font-size: 0.875rem;
      text-align: left;
    }

    th {
      background: #f1f5f9;
      color: var(--text-muted);
      font-weight: 600;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background-color: #f8fafc;
    }

    /* Botones dentro de la Tabla */
    td button {
      padding: 0.35rem 0.65rem;
      font-size: 0.75rem;
      margin-right: 0.4rem;
    }

    td button:first-child {
      background: #e0e7ff;
      color: var(--primary);
    }
    td button:first-child:hover { background: #c7d2fe; }

    td button:last-child {
      background: #fee2e2;
      color: var(--danger);
    }
    td button:last-child:hover { background: #fecaca; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h2>Captura de Datos</h2>

      <form id="formulario">
        <input type="hidden" id="id">

        <div class="form-grid">
          <div class="field-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" required>
          </div>

          <div class="field-group">
            <label for="edad">Edad:</label>
            <input type="number" id="edad" required min="1" max="120">
          </div>

          <div class="field-group">
            <label for="cargo">Cargo:</label>
            <input type="text" id="cargo" required>
          </div>

          <!-- >>> AGREGAR CAMPO NUEVO (lugar 1 de 6)
               Copia un bloque .field-group completo y cambia el nombre y el id.
               Ejemplo:
               <div class="field-group">
                 <label for="telefono">Teléfono:</label>
                 <input type="text" id="telefono" required>
               </div>
          -->
          <div class="field-group">
            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" required>
          </div>

          <div class="field-group">
            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" required>
          </div>

          <div class="field-group">
            <label for="departamento">Departamento de trabajo:</label>
            <input type="text" id="departamento" required>
          </div>

          <div class="field-group">
            <label for="turno">Turno laboral:</label>
            <input type="text" id="turno" required>
          </div>

          <div class="field-group">
            <label for="experiencia">Años de experiencia:</label>
            <input type="number" id="experiencia" required>
          </div>

          <div class="field-group">
            <label for="estudios">Nivel de estudios:</label>
            <input type="text" id="estudios" required>
          </div>
        </div>

        <div class="actions-bar">
          <button type="button" id="btnRegistrar">Registrar</button>
          <button type="button" id="btnConsultar">Consultar</button>
          <button type="button" id="btnModificar">Modificar</button>
          <button type="button" id="btnEliminar">Eliminar</button>
        </div>
      </form>

      <p id="estado"></p>
    </div>

    <div id="seccionTabla" class="card">
      <div class="table-controls">
        <h2>Registros</h2>
        <button type="button" id="btnCerrar">Cerrar tabla</button>
      </div>

      <div style="margin-bottom: 1rem;">
        <input type="text" id="buscador" placeholder="Buscar por nombre...">
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Nombre</th>
              <th>Edad</th>
              <th>Cargo</th>
              <!-- >>> AGREGAR CAMPO NUEVO (lugar 2 de 6)
                   Agrega aquí el encabezado de la columna nueva.
                   Ejemplo: <th>Teléfono</th>
              -->
              <th>Correo electrónico</th>
              <th>Teléfono</th>
              <th>Departamento de trabajo</th>
              <th>Turno laboral</th>
              <th>Años de experiencia</th>
              <th>Nivel de estudios</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Pega aquí la URL de tu implementación de Apps Script
    var URL_SCRIPT = "https://script.google.com/macros/s/AKfycbzmr_MUC-8YlFtUeZcM0Uq9gBn424LC-OvpQI4WgsDK4xwTPLma531k2fHR14rbHYx_/exec";
    var registros = [];
    var tablaVisible = false;

    // ---------- Enviar datos al script ----------
    function enviar(datos) {
      return fetch(URL_SCRIPT, {
        method: "POST",
        body: new URLSearchParams(datos)
      }).then(function (r) { return r.json(); });
    }

    // ---------- Botones activos según el estado ----------
    // Registrar: solo si NO hay un registro cargado
    // Modificar y Eliminar: solo si hay un registro cargado
    function actualizarBotones() {
      var hayRegistro = document.getElementById("id").value !== "";
      document.getElementById("btnRegistrar").disabled = hayRegistro;
      document.getElementById("btnModificar").disabled = !hayRegistro;
      document.getElementById("btnEliminar").disabled = !hayRegistro;
    }

    function limpiarFormulario() {
      document.getElementById("formulario").reset();
      document.getElementById("id").value = "";
      actualizarBotones();
    }

    // ---------- REGISTRAR ----------
    document.getElementById("btnRegistrar").onclick = function () {
      if (!document.getElementById("formulario").reportValidity()) return;

      document.getElementById("estado").textContent = "Guardando...";
      enviar({
        accion: "guardar",

        // >>> AGREGAR CAMPO NUEVO (lugar 3 de 6)
        // Cada campo termina con coma, EXCEPTO el último.
        // Ejemplo con telefono:
        //    cargo: document.getElementById("cargo").value,
        //    telefono: document.getElementById("telefono").value
        nombre: document.getElementById("nombre").value,
        edad: document.getElementById("edad").value,
        cargo: document.getElementById("cargo").value,
        correo: document.getElementById("correo").value,
        telefono: document.getElementById("telefono").value,
        departamento: document.getElementById("departamento").value,
        turno: document.getElementById("turno").value,
        experiencia: document.getElementById("experiencia").value,
        estudios: document.getElementById("estudios").value

      }).then(function (respuesta) {
        terminarAccion(respuesta, "¡Registro guardado!");
      });
    };

    // ---------- CONSULTAR ----------
    document.getElementById("btnConsultar").onclick = function () {
      document.getElementById("estado").textContent = "Consultando...";
      tablaVisible = true;
      document.getElementById("seccionTabla").style.display = "block";
      cargarRegistros(function () {
        document.getElementById("estado").textContent = "";
      });
    };

    function cargarRegistros(alTerminar) {
      fetch(URL_SCRIPT)
        .then(function (r) { return r.json(); })
        .then(function (datos) {
          registros = datos;
          mostrarTabla();
          if (alTerminar) alTerminar();
        });
    }

    function mostrarTabla() {
      var filtro = document.getElementById("buscador").value.trim().toLowerCase();
      var tabla = document.getElementById("tabla");
      tabla.innerHTML = "";

      registros.forEach(function (reg) {
        // Solo muestra los nombres que INICIAN con lo escrito
        if (!reg.nombre.toString().toLowerCase().startsWith(filtro)) return;

        var tr = document.createElement("tr");
        agregarCelda(tr, new Date(reg.fecha).toLocaleString());

        // >>> AGREGAR CAMPO NUEVO (lugar 4 de 6)
        // Agrega una línea por cada campo, en el mismo orden que los <th>.
        // Ejemplo: agregarCelda(tr, reg.telefono);
        agregarCelda(tr, reg.nombre);
        agregarCelda(tr, reg.edad);
        agregarCelda(tr, reg.cargo);
        agregarCelda(tr, reg.correo);
        agregarCelda(tr, reg.telefono);
        agregarCelda(tr, reg.departamento);
        agregarCelda(tr, reg.turno);
        agregarCelda(tr, reg.experiencia);
        agregarCelda(tr, reg.estudios);

        var td = document.createElement("td");

        var btnModificarFila = document.createElement("button");
        btnModificarFila.textContent = "Modificar registro";
        btnModificarFila.onclick = function () { cargarEnFormulario(reg); };

        var btnEliminarFila = document.createElement("button");
        btnEliminarFila.textContent = "Eliminar";
        btnEliminarFila.onclick = function () { eliminar(reg.id); };

        td.appendChild(btnModificarFila);
        td.appendChild(btnEliminarFila);
        tr.appendChild(td);
        tabla.appendChild(tr);
      });
    }

    function agregarCelda(fila, texto) {
      var td = document.createElement("td");
      td.textContent = texto;
      fila.appendChild(td);
    }

    document.getElementById("buscador").oninput = mostrarTabla;

    // ---------- CERRAR TABLA ----------
    document.getElementById("btnCerrar").onclick = function () {
      tablaVisible = false;
      document.getElementById("seccionTabla").style.display = "none";
      document.getElementById("buscador").value = "";
      document.getElementById("tabla").innerHTML = "";
    };

    // ---------- Pasar el registro al formulario ----------
    function cargarEnFormulario(reg) {
      document.getElementById("id").value = reg.id;

      // >>> AGREGAR CAMPO NUEVO (lugar 5 de 6)
      // Agrega una línea por cada campo (aquí SÍ todas terminan en punto y coma).
      // Ejemplo: document.getElementById("telefono").value = reg.telefono;
      document.getElementById("nombre").value = reg.nombre;
      document.getElementById("edad").value = reg.edad;
      document.getElementById("cargo").value = reg.cargo;
      document.getElementById("correo").value = reg.correo;
      document.getElementById("telefono").value = reg.telefono;
      document.getElementById("departamento").value = reg.departamento;
      document.getElementById("turno").value = reg.turno;
      document.getElementById("experiencia").value = reg.experiencia;
      document.getElementById("estudios").value = reg.estudios;

      document.getElementById("estado").textContent =
        "Modificando registro: cambia los datos y presiona Modificar";
      actualizarBotones();

      window.scrollTo(0, 0);                     // sube al formulario
      document.getElementById("nombre").focus(); // cursor en el nombre
    }

    // ---------- MODIFICAR ----------
    document.getElementById("btnModificar").onclick = function () {
      var id = document.getElementById("id").value;

      if (id === "") {
        alert("Primero elige un registro con el botón 'Modificar registro'");
        return;
      }
      if (!document.getElementById("formulario").reportValidity()) return;

      document.getElementById("estado").textContent = "Modificando...";
      enviar({
        accion: "editar",
        id: id,

        // >>> AGREGAR CAMPO NUEVO (lugar 6 de 6)
        // Igual que en REGISTRAR: coma en todos, menos en el último.
        // Ejemplo con telefono:
        //    cargo: document.getElementById("cargo").value,
        //    telefono: document.getElementById("telefono").value
        nombre: document.getElementById("nombre").value,
        edad: document.getElementById("edad").value,
        cargo: document.getElementById("cargo").value,
        correo: document.getElementById("correo").value,
        telefono: document.getElementById("telefono").value,
        departamento: document.getElementById("departamento").value,
        turno: document.getElementById("turno").value,
        experiencia: document.getElementById("experiencia").value,
        estudios: document.getElementById("estudios").value

      }).then(function (respuesta) {
        terminarAccion(respuesta, "¡Registro modificado!");
      });
    };

    // ---------- ELIMINAR ----------
    document.getElementById("btnEliminar").onclick = function () {
      eliminar(document.getElementById("id").value);
    };

    function eliminar(id) {
      if (!confirm("¿Seguro que quieres eliminar este registro?")) return;

      document.getElementById("estado").textContent = "Eliminando...";
      enviar({ accion: "eliminar", id: id }).then(function (respuesta) {
        terminarAccion(respuesta, "Registro eliminado");
      });
    }

    // ---------- Mensaje al terminar cualquier acción ----------
    function terminarAccion(respuesta, mensajeOk) {
      document.getElementById("estado").textContent =
        respuesta.ok ? mensajeOk : "Error: " + respuesta.mensaje;
      limpiarFormulario();
      if (tablaVisible) cargarRegistros();  // refresca la tabla si está abierta
    }

    actualizarBotones();
  </script>

</body>
</html>
